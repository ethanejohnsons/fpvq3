// fpvq3 controls for an RC transmitter in USB joystick mode (EdgeTX/OpenTX, AETR).
// Set up for a Jumper T-Pro (OpenTX), AETR on CH1-4, mode 2.
// fly.sh runs this after fpv.cfg when CONTROLS=radio (the default).

// Acro (rate) mode. For self-levelling, set dr_mode 1 (or press M to cycle).
seta dr_mode 0

// --- joystick ---------------------------------------------------------------
// SDL treats the T-Pro as a gamepad. fly.sh gives it a mode-2 mapping
// (SDL_GAMECONTROLLERCONFIG) so all four channels are full-range sticks:
//   left stick:  X = CH4 yaw,  Y = CH3 throttle
//   right stick: X = CH1 roll, Y = CH2 pitch
// and the bindings below route each stick into the movement channels.
seta in_joystick 1
seta in_joystickUseAnalog 1
seta joy_threshold 0            // no deadzone: throttle is not centred

seta j_side_axis 0              // slots in the engine's axis table, any
seta j_forward_axis 1           // distinct numbers will do
seta j_up_axis 2
seta j_yaw_axis 3
seta j_pitch_axis 7             // unused slot: the radio never moves the view pitch
seta j_pitch 0

// Full stick (32767) -> 127 in the usercmd.
seta j_side 0.00388
seta j_forward 0.00388
seta j_up 0.00388
// Yaw is sent as a view rotation: full stick = 1000 deg/s (DRONE_YAW_FULLSCALE).
seta j_yaw -0.0305185

// Stick directions -> commands (the engine reads them as analog, not keys).
// To reverse an axis, swap the two commands on that stick.
bind PAD0_RIGHTSTICK_RIGHT "+moveright"   // roll
bind PAD0_RIGHTSTICK_LEFT  "+moveleft"
bind PAD0_RIGHTSTICK_DOWN  "+forward"     // pitch (CH2 up reads as "down")
bind PAD0_RIGHTSTICK_UP    "+back"
bind PAD0_LEFTSTICK_DOWN   "+moveup"      // throttle (CH3 up reads as "down")
bind PAD0_LEFTSTICK_UP     "+movedown"
bind PAD0_LEFTSTICK_RIGHT  "+right"       // yaw
bind PAD0_LEFTSTICK_LEFT   "+left"

// Keep the mouse out of the flight controls. Stock Quake binds the right
// button to +strafe, which turns mouse movement into roll and pitch.
seta m_yaw 0
seta m_pitch 0
seta m_side 0
seta m_forward 0
bind MOUSE1 "+attack"
unbind MOUSE2
unbind MOUSE3

// --- buttons ----------------------------------------------------------------
// The drone arms itself as soon as a stick moves after spawning.
// Radio switches: SDL only reports the ones the mapping names, so add e.g.
// "a:b0,b:b1," to SDL_GAMECONTROLLERCONFIG (tools/calibrate.py finds the
// numbers). A momentary switch on "a" fires, one on "b" resets.
bind PAD0_A "+attack"
bind PAD0_B "+button7"

// Camera uptilt (also where shots go): mouse wheel or [ and ], dr_camstep
// degrees per step.
bind MWHEELUP "dr_camup"
bind MWHEELDOWN "dr_camdown"
bind ] "dr_camup"
bind [ "dr_camdown"
