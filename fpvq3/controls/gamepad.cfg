// fpvq3 controls for a game controller, PlayStation or Xbox style
// (CONTROLS=gamepad ./fly.sh). Runs after fpv.cfg. SDL knows most
// controllers, so no SDL_GAMECONTROLLERCONFIG is needed.
//
// Easy mode with a shooter layout: the left stick sets the speed along
// where you look, the right stick looks and aims, R1 / L1 climb and sink
// (let go and it holds its height), R2 fires.
//
//   left stick   fly forward / back / sideways    R2  fire
//   right stick  look and aim                     L2  zoom
//   R1 or Cross  climb                            Triangle / Square  next / previous weapon
//   L1 or Circle sink                             D-pad down  chase camera
//   Share/Back   reset                            D-pad up    scores
seta dr_mode 2

seta in_joystick 1
seta in_joystickUseAnalog 1
seta joy_threshold 0.15         // deadzone for self-centring sticks

seta j_side_axis 0              // slots in the engine's axis table, any
seta j_forward_axis 1           // distinct numbers will do
seta j_up_axis 2
seta j_yaw_axis 3
seta j_pitch_axis 4

// Full stick (32767) -> 127 in the usercmd, i.e. full speed.
seta j_side 0.00388
seta j_forward 0.00388
seta j_up 0.00388
// Look speed at full stick: yaw 200 deg/s, pitch 150 deg/s.
seta j_yaw -0.0061
seta j_pitch 0.0046

// Stick directions -> commands (the engine reads them as analog, not keys).
bind PAD0_LEFTSTICK_UP     "+forward"
bind PAD0_LEFTSTICK_DOWN   "+back"
bind PAD0_LEFTSTICK_LEFT   "+moveleft"
bind PAD0_LEFTSTICK_RIGHT  "+moveright"
bind PAD0_RIGHTSTICK_LEFT  "+left"
bind PAD0_RIGHTSTICK_RIGHT "+right"
bind PAD0_RIGHTSTICK_UP    "+lookup"
bind PAD0_RIGHTSTICK_DOWN  "+lookdown"

bind PAD0_RIGHTTRIGGER  "+attack"
bind PAD0_LEFTTRIGGER   "+zoom"
bind PAD0_RIGHTSHOULDER "+moveup"
bind PAD0_LEFTSHOULDER  "+movedown"
bind PAD0_A "+moveup"
bind PAD0_B "+movedown"
bind PAD0_Y "weapnext"
bind PAD0_X "weapprev"
bind PAD0_BACK  "dr_reset"
bind PAD0_START "togglemenu"
bind PAD0_DPAD_UP   "+scores"
bind PAD0_DPAD_DOWN "toggle cg_thirdPerson"

// The mouse can still look around.
seta m_yaw 0.022
seta m_pitch 0.022
seta m_side 0
seta m_forward 0
bind MOUSE1 "+attack"
