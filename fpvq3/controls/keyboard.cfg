// fpvq3 controls for keyboard and mouse (CONTROLS=keyboard ./fly.sh).
// Runs after fpv.cfg.
//
// Easy mode: it flies like a normal Quake player who can fly. WASD sets the
// speed along where you look, space / C climb and sink (let go and it holds
// its height), and the mouse aims; the drone tilts and turns under you.
seta dr_mode 2

seta in_joystick 0

// Mouse look, like stock Quake (the radio setup turns these off)
seta m_yaw 0.022
seta m_pitch 0.022
seta m_side 0
seta m_forward 0
seta cl_freelook 1
seta cl_run 1                   // hold shift to fly at half speed

bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
bind SPACE "+moveup"
bind c "+movedown"
bind CTRL "+movedown"
bind SHIFT "+speed"

bind MOUSE1 "+attack"
bind MOUSE2 "+zoom"
unbind MOUSE3
bind MWHEELUP "weapprev"
bind MWHEELDOWN "weapnext"
