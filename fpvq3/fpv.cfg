// fpvq3 settings shared by every control setup.
// fly.sh runs this, then controls/<radio|gamepad|keyboard>.cfg (CONTROLS=...).
// To switch in game, open the console and type e.g. "exec controls/keyboard.cfg".
// Change values here, not in q3config.cfg.

// --- buttons ----------------------------------------------------------------
// Reset: back to a spawn point. With weapons on (dr_weapons 1) it self-destructs
// instead, and respawns from the wreck like a normal death.
bind r "dr_reset"
bind F5 "toggle cg_thirdPerson"
// Flight mode: 0 acro, 1 level (self-levelling), 2 easy (keyboard / gamepad)
bind m "toggle dr_mode 0 1 2"
bind TAB "+scores"

// Weapons, as in stock Quake
bind 1 "weapon 1"
bind 2 "weapon 2"
bind 3 "weapon 3"
bind 4 "weapon 4"
bind 5 "weapon 5"
bind 6 "weapon 6"
bind 7 "weapon 7"
bind 8 "weapon 8"
bind 9 "weapon 9"

// --- view and feel ----------------------------------------------------------
seta cg_fov 115
seta cg_drawGun 0
seta com_maxfps 250
seta cg_thirdPersonRange 80
// Near clip 1 instead of 4: the drone is small, and with the default the
// camera sees through walls and ceilings it is pressed against. It is a
// cheat cvar, so it only applies on devmap/local games (which fly.sh uses).
set r_znear 1

// Betaflight-style rates (acro, and yaw in level): roll rc super expo  pitch ...  yaw ...
seta dr_rates "1.0 0.7 0 1.0 0.7 0 1.0 0.7 0"
